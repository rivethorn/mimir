name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ODIN_RELEASE: latest

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            odin_os: linux
            odin_arch: amd64
            odin_ext: tar.gz
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            odin_os: linux
            odin_arch: arm64
            odin_ext: tar.gz
          - os: macos-15-intel
            platform: macos
            arch: x64
            odin_os: macos
            odin_arch: amd64
            odin_ext: tar.gz
          - os: macos-15
            platform: macos
            arch: arm64
            odin_os: macos
            odin_arch: arm64
            odin_ext: tar.gz
          - os: windows-2025
            platform: windows
            arch: x64
            odin_os: windows
            odin_arch: amd64
            odin_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and package mimir
        uses: ./.github/actions/build-mimir
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          odin_os: ${{ matrix.odin_os }}
          odin_arch: ${{ matrix.odin_arch }}
          odin_ext: ${{ matrix.odin_ext }}
          odin_release: ${{ env.ODIN_RELEASE }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimir-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            mimir-*.tar.gz
            mimir-*.zip
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
